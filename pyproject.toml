[project]
name = "systemone-gridworld"
version = "0.0.1"
description = "A deterministic gridworld that benchmarks any System One decision backend: text or image observations, scripted oracle, live view, decisions-per-second."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Madeline Lovelace" }]
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[project.optional-dependencies]
image = ["Pillow>=10"]
view = ["pygame-ce>=2.5", "Pillow>=10"]
http = ["httpx>=0.27"]
# In-process backend against the golden library (sibling checkout or GitHub).
local = ["mlx-classifiers @ git+https://github.com/lovelacemadeline/mlx-lm-as-classifiers.git"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
gridworld = "gridworld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gridworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
